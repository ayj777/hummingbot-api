name: hummingbot-api
channels:
  - conda-forge
  - defaults
dependencies:
  - python=3.12
  - fastapi
  - uvicorn
  - boto3
  - libcxx                
  - libta-lib>=0.6.4
  - python-dotenv
  - pandas>=2.3.2
  - numba>=0.61.2
  - numpy>=2.2.6
  - pandas-ta>=0.4.71b
  - ta-lib>=0.6.4
  - tqdm>=4.67.1
  - psutil>=5.9.0
  - docker-py
  - pip
  - pip:
      # Pinned to ayj777/hummingbot master after PR #13
      # b437a01c87b4579b0a6e4c163a7d31c70a3c9a87. Those core changes are not in
      # a PyPI release yet. utils/core_compatibility.py refuses to start against
      # a core that is missing them, so a wrong install is a startup error
      # rather than a deployment that books zeros in silence.
      - hummingbot @ git+https://github.com/ayj777/hummingbot.git@b437a01c87b4579b0a6e4c163a7d31c70a3c9a87
      - geckoterminal-py>=0.3.1
      - msgpack>=1.0.5
      - flake8
      - isort
      - pytest
      - pytest-asyncio
      - pre-commit
      - logfire
      - logfire[fastapi]
      - logfire[system-metrics]
      - aiomqtt>=2.0.0
      - sqlalchemy>=2.0.0
      - asyncpg
      - psycopg2-binary
      - greenlet
      - pydantic-settings
